# =============================================================================
# Knative Service — serverless weather lookup with TWO revisions:
#   weather-v1 — original (12 parks)
#   weather-v2 — adds Crater Lake, Arches, Bryce Canyon (15 parks)
#
# Traffic split: 80% v1 / 20% v2 — change percentages to redirect traffic.
# Set { latestRevision: true, percent: 100 } to send all traffic to the latest.
# =============================================================================
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: weather
  namespace: parks
  labels:
    app.kubernetes.io/name: weather
    app.kubernetes.io/part-of: parks
    app.kubernetes.io/component: serverless-api
spec:
  template:
    metadata:
      # ↑ bump this and REVISION_LABEL together to create a new revision.
      name: weather-v2
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/metric: "concurrency"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containerConcurrency: 10
      timeoutSeconds: 30
      containers:
        - image: image-registry.openshift-image-registry.svc:5000/parks/weather:latest
          imagePullPolicy: Always
          ports:
            - { containerPort: 8080, name: http1 }
          env:
            - { name: REVISION_LABEL, value: "v2" }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
  traffic:
    - revisionName: weather-v1
      percent: 80
    - revisionName: weather-v2
      percent: 20
