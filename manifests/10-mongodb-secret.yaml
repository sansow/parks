---
# Credentials referenced by both the VM cloud-init (via the matching values)
# and the nationalparks Spring Boot Deployment.
# Same shape as the legacy mongodb-ephemeral template.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb
  namespace: parks
type: Opaque
stringData:
  database-user: mongodb
  database-password: mongodb
  database-admin-password: mongodb
  database-name: mongodb
