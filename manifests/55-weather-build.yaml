# =============================================================================
# Docker (multi-stage) build for the weather Quarkus app.
# Switched from Source/S2I to Docker strategy because the OpenJDK S2I builder
# auto-detects Quarkus and forces target/quarkus-app/ paths that fight uber-jar
# packaging. The multi-stage Dockerfile in the source repo handles it cleanly.
# =============================================================================
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: weather
  namespace: parks
  labels:
    app.kubernetes.io/name: weather
    app.kubernetes.io/part-of: parks
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: weather
  namespace: parks
  labels:
    app.kubernetes.io/name: weather
    app.kubernetes.io/part-of: parks
spec:
  source:
    type: Git
    git:
      uri: https://github.com/sansow/parks.git
      ref: main
    contextDir: weather-service
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: src/main/docker/Dockerfile.jvm
  output:
    to:
      kind: ImageStreamTag
      name: weather:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  resources:
    limits:
      memory: 2Gi                       # Maven compile in stage 1 needs headroom
