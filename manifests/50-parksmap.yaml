---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parksmap
  namespace: parks
  labels:
    app.kubernetes.io/name: parksmap
    app.kubernetes.io/part-of: parks
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: parksmap } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: parksmap
        app.kubernetes.io/part-of: parks
    spec:
      serviceAccountName: parksmap
      containers:
        - name: parksmap
          image: quay.io/openshiftroadshow/parksmap:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          env:
            # Tell parksmap which Route label to discover backends by.
            # Default in 1.3.0 is type=parksmap-backend.
            - { name: BACKEND_LABEL_NAME,  value: type }
            - { name: BACKEND_LABEL_VALUE, value: nationalparks-backend }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ws/healthz, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /ws/healthz, port: 8080 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: parksmap
  namespace: parks
  labels:
    app.kubernetes.io/name: parksmap
spec:
  selector: { app.kubernetes.io/name: parksmap }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: parksmap
  namespace: parks
spec:
  to: { kind: Service, name: parksmap }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
