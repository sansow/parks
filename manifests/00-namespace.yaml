---
apiVersion: v1
kind: Namespace
metadata:
  name: parks
  labels:
    app.kubernetes.io/part-of: parks
    pod-security.kubernetes.io/enforce: restricted
    parksmap-discovery: "true"
---
# parksmap polls the K8s API for Routes labelled type=parksmap-backend.
# Needs a SA with view permission so the controller can list resources.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: parksmap
  namespace: parks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: parksmap-view
  namespace: parks
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: parksmap
    namespace: parks
