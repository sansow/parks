---
# Service named "mongodb" — selects the VM's virt-launcher pod by domain label.
# To consumers (the nationalparks Spring Boot pod), this is just a Service on
# port 27017 — they don't know the backend is a VM.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: parks
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  selector:
    kubevirt.io/domain: mongodb
  ports:
    - { name: mongo, port: 27017, targetPort: 27017, protocol: TCP }
  type: ClusterIP
---
# Only allow the parks namespace to reach the VM on 27017.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-mongodb-vm
  namespace: parks
spec:
  podSelector:
    matchLabels:
      kubevirt.io/domain: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 27017, protocol: TCP }
