# --- HTTP -------------------------------------------------------------------
quarkus.package.jar.type=uber-jar

quarkus.http.port=8080
quarkus.http.access-log.enabled=true

# --- Open-Meteo REST client (free, no auth) ---------------------------------
quarkus.rest-client.OpenMeteoClient.uri=https://api.open-meteo.com
quarkus.rest-client.OpenMeteoClient.connect-timeout=3000
quarkus.rest-client.OpenMeteoClient.read-timeout=5000

# --- Cache: 5 min per park --------------------------------------------------
quarkus.cache.caffeine."weather-5min".expire-after-write=PT5M
quarkus.cache.caffeine."weather-5min".maximum-size=128

# --- Health, metrics --------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics
